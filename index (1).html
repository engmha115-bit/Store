<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المهندس – اطلب أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f6;--surface:#fff;--ink:#12303a;--muted:#5b7078;--brand:#0f5a6b;--brand-ink:#fff;--accent:#f0a500;--line:#d8e2e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b20;--surface:#15282f;--ink:#e8f1f3;--muted:#9bb3ba;--brand:#4db8cf;--brand-ink:#08222a;--accent:#f5b82e;--line:#27424b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1b20;--surface:#15282f;--ink:#e8f1f3;--muted:#9bb3ba;--brand:#4db8cf;--brand-ink:#08222a;--accent:#f5b82e;--line:#27424b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:36px 0 20px}
h1{font-size:2.1rem;font-weight:800;margin:0 0 6px;line-height:1.3}
header p{margin:0 0 18px;color:var(--muted);max-width:34ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 20px;font:600 1rem 'Cairo',Tahoma,sans-serif;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-size:1.4rem;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:auto;border-radius:10px;display:block}
.specs{margin:4px 0 6px;padding:0;list-style:none;font-size:.95rem}.specs li{padding:2px 0}
.card .ico{font-size:2.4rem;line-height:1}
.card b{font-size:1.05rem}
.card small{color:var(--muted)}
.price{font-weight:800;color:var(--brand);font-size:1.1rem}
.qty{display:flex;align-items:center;gap:10px;margin-top:auto}
.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:800}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:28px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 1rem 'Cairo',Tahoma,sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{margin:14px 0;padding:12px;border-radius:10px;background:var(--bg);font-weight:600}
.err{color:#c0392b;min-height:1.5em;margin:6px 0 0}
footer{padding:0 0 40px;color:var(--muted);font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1 id="shopName"></h1>
<p>اختار اللي يعجبك، املا بياناتك، وطلبك يوصلنا على واتساب علطول.</p>
<div class="row">
<a class="btn" href="#order">اطلب دلوقتي</a>
<a class="btn alt" id="fbLink" target="_blank" rel="noopener">صفحتنا على فيسبوك</a>
</div>
</header>

<h2>المنتجات</h2>
<div class="grid" id="grid"></div>

<h2 id="order">الطلب والحجز</h2>
<div class="panel">
<div class="tabs" role="group" aria-label="نوع الطلب">
<button id="tOrder" aria-pressed="true">طلب منتجات</button>
<button id="tBook" aria-pressed="false">حجز منتج</button>
</div>
<div class="sum" id="sum"></div>
<label for="name">الاسم</label>
<input id="name" autocomplete="name">
<label for="phone">رقم الموبايل</label>
<input id="phone" type="tel" inputmode="tel" autocomplete="tel">
<div id="orderFields">
<label for="addr">العنوان</label>
<input id="addr" autocomplete="street-address">
</div>
<div id="bookFields" hidden>
<div class="two">
<div><label for="date">يوم الاستلام</label><input id="date" type="date"></div>
<div><label for="time">الساعة</label><input id="time" type="time"></div>
</div>
</div>
<label for="note">ملاحظات (اختياري)</label>
<textarea id="note" rows="2"></textarea>
<p class="err" id="err" role="alert"></p>
<button class="btn" id="send" style="width:100%">ابعت الطلب على واتساب</button>
</div>

<footer>الشحن لجميع المحافظات 70 ج. بعد ما تبعت، هنأكد معاك الطلب على واتساب.</footer>
</div>

var cart={},mode="order";
var $=function(id){return document.getElementById(id)};
$("shopName").textContent=CONFIG.shop;
document.title=CONFIG.shop+" – اطلب أونلاين";
$("fbLink").href=CONFIG.facebook;

function renderGrid(){
  $("grid").innerHTML=PRODUCTS.map(function(x){
    return '<div class="card">'+(x.img?'<img src="'+x.img+'" alt="'+x.n+'">':'<div class="ico">'+x.i+'</div>')+'<b>'+x.n+'</b><small>'+x.d+'</small>'+(x.specs?'<ul class="specs">'+x.specs.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>':'')+'<div class="price">'+x.p+' '+CONFIG.currency+(x.tiers?'<br><small style="font-weight:400">قطعتين '+x.tiers[1]+' • 3 قطع '+x.tiers[2]+' • 4 قطع '+x.tiers[3]+' '+CONFIG.currency+'</small>':'')+'</div>'+
    '<div class="qty"><button aria-label="زوّد" data-a="1" data-id="'+x.id+'">+</button><span id="q'+x.id+'">0</span><button aria-label="قلّل" data-a="-1" data-id="'+x.id+'">−</button></div></div>';
  }).join("");
}
$("grid").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var id=b.dataset.id,v=(cart[id]||0)+Number(b.dataset.a);
  if(v<0)v=0;cart[id]=v;$("q"+id).textContent=v;summary();
});
function price(x,q){if(!q)return 0;if(!x.tiers)return x.p*q;var n=x.tiers.length;return q<=n?x.tiers[q-1]:x.tiers[n-1]+(q-n)*x.each}
function total(){
  var t=0,c=0;PRODUCTS.forEach(function(x){var q=cart[x.id]||0;t+=price(x,q);c+=q});var sh=(mode==="order"&&c)?CONFIG.ship:0;return{t:t+sh,sub:t,ship:sh,c:c};
}
function summary(){
  var s=total();
  $("sum").textContent=s.c?("عدد القطع: "+s.c+" — المنتجات "+s.sub+(s.ship?" + شحن "+s.ship:"")+" = الإجمالي "+s.t+" "+CONFIG.currency):"السلة فاضية، اختار منتجاتك من فوق.";
}
function setMode(m){
  mode=m;
  $("tOrder").setAttribute("aria-pressed",m==="order");
  $("tBook").setAttribute("aria-pressed",m==="book");
  $("orderFields").hidden=m!=="order";
  $("bookFields").hidden=m!=="book";summary();
}
$("tOrder").onclick=function(){setMode("order")};
$("tBook").onclick=function(){setMode("book")};

$("send").onclick=function(){

  else if(mode==="order"&&!$("addr").value.trim())err="اكتب العنوان.";
  else if(mode==="book"&&(!$("date").value||!$("time").value))err="اختار يوم وساعة الاستلام.";
  $("err").textContent=err;if(err)return;

  var msg=(mode==="order"?"طلب جديد":"حجز جديد")+" من "+CONFIG.shop+"\n\n"+lines.join("\n")+"\n\n"+(s.ship?"الشحن: "+s.ship+" "+CONFIG.currency+"\n":"")+"الإجمالي: "+s.t+" "+CONFIG.currency+"\n"+"الاسم: "+name+"\nالموبايل: "+phone+"\n";
  if(mode==="order")msg+="العنوان: "+$("addr").value.trim()+"\n";
  else msg+="موعد الاستلام: "+$("date").value+" الساعة "+$("time").value+"\n";
  if($("note").value.trim())msg+="ملاحظات: "+$("note").value.trim();
  var a=document.createElement("a");
  a.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg);
  a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
};
renderGrid();summary();
</script>
